name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv requirements --dev > requirements-ci.txt
          pip install -r requirements-ci.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -v

[project]
name = "vetty-backend"
version = "1.0.0"
description = "Vetty - Flask REST API for a veterinary e-commerce and services platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
